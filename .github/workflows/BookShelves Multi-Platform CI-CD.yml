name: BookShelves Multi-Platform CI-CD

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches:
       - '**'
    tags:
       - 'v*'
  pull_request:
    branches:
      - 'main'
      - 'release/**'
    types:
      - opened
      - reopened
      - synchronize
  # release:
  #   types: [published]

concurrency:
  group: bookshelves-ci-cd-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJPATH: '.'
  APPHOST_CSPROJ: 'src/BookShelves.AppHost/BookShelves.AppHost.csproj'
  WEB_PROJPATH: 'src/BookShelves.Web/BookShelves.Web'
  WEB_CSPROJ: 'src/BookShelves.Web/BookShelves.Web/BookShelves.Web.csproj' #this includes the parent folder due to it being a dockerfile build
  WEBAPI_PROJPATH: 'src/BookShelves.WebApi'
  WEBAPI_CSPROJ: 'src/BookShelves.WebApi/BookShelves.WebApi.csproj' #this includes the parent folder due to it being a dockerfile build
  MAUI_PROJPATH: 'src/BookShelves.Maui'
  MAUI_CSPROJ: 'src/BookShelves.Maui/BookShelves.Maui.csproj'
  MAUI_IOS_PUBLISH_PATH: '${{ github.workspace }}/publish-output/ios'
  MAUI_IOS_ARTIFACTS_PATH: 'artifacts_ios'
  MAUI_IOS_MAC_BUNDLE_ID: 'com.azmoore.bookshelves.maui'
  MAUI_IOS_CODESIGN_PROVISION: 'BookShelves Test Profile'
  MAUI_IOS_CODESIGN_KEY: 'iOS Distribution'
  MAUI_IOS_CODESIGN_ENTITLEMENTS: 'Platforms/iOS/Entitlements.plist'
  MAUI_MAC_PUBLISH_PATH: '${{ github.workspace }}/publish-output/mac'
  MAUI_MAC_ARTIFACTS_PATH: 'artifacts_mac'
  MAUI_MAC_CODESIGN_PROVISION: 'BookShelves MacOS Provisioning'
  MAUI_MAC_CODESIGN_KEY: 'Apple Distribution: Derek Moore (TPKXH5FT2P)'
  MAUI_MAC_PACKAGE_SIGNING_KEY: '3rd Party Mac Developer Installer: Derek Moore (TPKXH5FT2P)'
  MAUI_MAC_CODESIGN_ENTITLEMENTS: 'Platforms/MacCatalyst/Entitlements.plist'
  MAUI_WINDOWS_PUBLISH_PATH: '${{ github.workspace }}/publish-output/windows'
  MAUI_WINDOWS_WINDOWS_ARTIFACTS_PATH: 'artifacts_windows'
  GH_EVENT_NAME: '${{ github.event_name }}'
  GH_BASE_REF: '${{ github.base_ref }}'
  GH_REF_TYPE: '${{ github.ref_type }}'
  GH_REF_NAME: '${{ github.ref_name }}'

  DOTNET_VERSION: 'net10.0'
  DOTNET_SDK_VERSION: '10.0.303'
  RELEASE_CONFIGURATION: 'Release'
  XCODE_VERSION: '26.6'

jobs:
  # =================================================================
  # STAGE 1: CORE VALIDATION & LOGICAL VERSION SYNCHRONIZATION
  # =================================================================
  validate:
    name: Verify Code & Versioning
    runs-on: ubuntu-latest
    outputs:
      AssemblySemFileVer: ${{ steps.gitversion.outputs.assemblySemFileVer }}
      AssemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}
      CommitsSinceVersionSource: ${{ steps.gitversion.outputs.commitsSinceVersionSource }}
      DisplayVersion: ${{ steps.gitversion.outputs.majorMinorPatch }}
      FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}
      InformationalVersion: ${{ steps.compute_version_identifier.outputs.informationalVersion }}
      ArtifactVersion: ${{ steps.compute_version_identifier.outputs.artifactVersion }}
      MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
      SemVer: ${{ steps.gitversion.outputs.semVer }}
      ShortSha: ${{ steps.gitversion.outputs.shortSha }}
      AppleBuildNumber: ${{ steps.compute_per_version.outputs.appleBuildNumber }}
      WindowsBuildNumber: ${{ steps.compute_per_version.outputs.windowsBuildNumber }}
      EnvironmentName: ${{ steps.compute_environment.outputs.environmentName }}
      IsValidReleaseTag: ${{ steps.validate_release_tag.outputs.isValidReleaseTag }}

    defaults:
      run:
        working-directory: ${{env.PROJPATH}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch Git Tags explicitly
        run: git fetch --tags --force
        working-directory: ${{ github.workspace }}

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{env.DOTNET_SDK_VERSION}}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.sln
            **/*.slnx
            **/global.json
            **/Directory.Packages.props
            **/NuGet.config

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Execute GitVersion Calculations
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          verbosity: Diagnostic
          targetPath: ${{ github.workspace }}

      - name: Compute shared version identifiers
        id: compute_version_identifier
        run: |
          SEMVER="${{ steps.gitversion.outputs.semVer }}"
          SHORT_SHA="${{ steps.gitversion.outputs.shortSha }}"
          FULL_SHA="${{ github.sha }}"
          INFORMATIONAL_VERSION="${SEMVER}+${FULL_SHA}"
          ARTIFACT_VERSION="${SEMVER}-${SHORT_SHA}"

          echo "informationalVersion=${INFORMATIONAL_VERSION}" >> $GITHUB_OUTPUT
          echo "artifactVersion=${ARTIFACT_VERSION}" >> $GITHUB_OUTPUT
          echo "Shared informational version: ${INFORMATIONAL_VERSION}"

      - name: Compute per-release build number
        id: compute_per_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SEMVER="${{ steps.gitversion.outputs.majorMinorPatch }}"
          RUN_NUM=${{ github.run_number }}
          APPLE_BUILD_NUM="$RUN_NUM"
          
          COUNTER_BRANCH="zz-build-counters"
          FILE_NAME="${SEMVER}.txt"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          
          echo "Configuring lightweight git worker..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch "main"
          
          # 1. Clone ONLY the tracking branch into a temporary directory
          # If the branch doesn't exist yet, we initialize it as an empty orphan branch
          TMP_DIR=$(mktemp -d)
          if git clone --branch "$COUNTER_BRANCH" --depth 1 "$REPO_URL" "$TMP_DIR" 2>/dev/null; then
            cd "$TMP_DIR"
          else
            echo "Branch '$COUNTER_BRANCH' does not exist. Initializing orphan tracking track..."
            cd "$TMP_DIR"
            git init
            git checkout --orphan "$COUNTER_BRANCH"
          fi
          
          # 2. Loop until the push succeeds (Handles parallel job collisions)
          MAX_ATTEMPTS=5
          ATTEMPT=1
          SUCCESS=false

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Syncing build number calculation (Attempt $ATTEMPT/$MAX_ATTEMPTS)..."
            
            # Read the previous number or start fresh at 1
            if [ -f "$FILE_NAME" ]; then
              LAST_NUM=$(cat "$FILE_NAME")
              WINDOWS_BUILD_NUM=$((LAST_NUM + 1))
              echo "Incrementing build track to $WINDOWS_BUILD_NUM..."
            else
              WINDOWS_BUILD_NUM=1
              echo "First build for version track $SEMVER. Initializing at 1..."
            fi
            
            # Write updated value
            echo "$WINDOWS_BUILD_NUM" > "$FILE_NAME"
            git add "$FILE_NAME"
            
            # Check if there are changes to commit (prevents empty commit crashes)
            if git diff-index --quiet HEAD --; then
              echo "No changes detected. Build number is already up to date."
              SUCCESS=true
              break
            fi

            git commit -m "chore: increment build counter for $SEMVER to $WINDOWS_BUILD_NUM [skip ci]"
            
            # Attempt to push to the server
            if git push "$REPO_URL" "$COUNTER_BRANCH"; then
              echo "Build number successfully updated on server."
              SUCCESS=true
              break
            else
              echo "Push rejected due to race condition. Re-fetching remote branch..."
              # Undo our local commit to cleanly rebase against the remote track
              git reset --hard HEAD~1
              git pull --rebase "$REPO_URL" "$COUNTER_BRANCH"
              ATTEMPT=$((ATTEMPT + 1))
              sleep 2
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "Failed to sync build number after $MAX_ATTEMPTS attempts due to heavy concurrency."
            exit 1
          fi
          
          # 3. Fail-safe boundary checks
          if [ "$WINDOWS_BUILD_NUM" -gt 65535 ]; then
            echo "Computed Windows build number $WINDOWS_BUILD_NUM exceeds Windows limit (65535)."
            exit 1
          fi
          
          # 4. Set job outputs
          echo "appleBuildNumber=${APPLE_BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "windowsBuildNumber=${WINDOWS_BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "iOS/Mac buildNumber: ${APPLE_BUILD_NUM}, Windows buildNumber: ${WINDOWS_BUILD_NUM}"

      - name: Compute deployment environment
        id: compute_environment
        run: |
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"

          if [ "$REF_TYPE" = "tag" ]; then
            if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              ENV_NAME="production"
            elif [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-([0-9A-Za-z]+)(\.[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              PRE_LABEL="${BASH_REMATCH[1],,}"
              case "$PRE_LABEL" in
                alpha|beta|rc)
                  ENV_NAME="$PRE_LABEL"
                  ;;
                *)
                  ENV_NAME="development"
                  ;;
              esac
            else
              ENV_NAME="development"
            fi
          elif [[ "$REF_NAME" == release/* || "$REF_NAME" == Release/* ]]; then
            ENV_NAME="beta"
          elif [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "master" ]; then
            ENV_NAME="alpha"
          elif [[ "$REF_NAME" == feature/* || "$REF_NAME" == features/* ]]; then
            ENV_NAME="development"
          else
            ENV_NAME="development"
          fi

          echo "environmentName=${ENV_NAME}" >> $GITHUB_OUTPUT
          echo "Deployment environment: ${ENV_NAME}"

      - name: Validate release tag format
        id: validate_release_tag
        run: |
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          VALID_TAG=false

          if [ "$REF_TYPE" = "tag" ]; then
            if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              VALID_TAG=true
            fi
          fi

          echo "isValidReleaseTag=${VALID_TAG}" >> $GITHUB_OUTPUT
          echo "Valid release tag: ${VALID_TAG}"

      - name: Show Calcs on Status
        run: |
          echo "### Build Details" >> $GITHUB_STEP_SUMMARY
          echo "GITHUB.REF_TYPE: ${GITHUB_REF_TYPE}" >> $GITHUB_STEP_SUMMARY
          echo "GITHUB.REF_NAME: ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY

          echo "SEMVER: ${GitVersion_SemVer}" >> $GITHUB_STEP_SUMMARY
          echo "SHORT_SHA: ${GitVersion_ShortSha}" >> $GITHUB_STEP_SUMMARY
          echo "FULL_SHA: ${sha}" >> $GITHUB_STEP_SUMMARY
          
          echo "INFORMATIONAL_VERSION: ${GitVersion_SemVer}+${sha}" >> $GITHUB_STEP_SUMMARY
          echo "ARTIFACT_VERSION: ${GitVersion_SemVer}-${GitVersion_ShortSha}" >> $GITHUB_STEP_SUMMARY

          echo "App Version: ${{ steps.compute_version_identifier.outputs.artifactVersion }}" >> $GITHUB_STEP_SUMMARY
          echo "iOS/Mac buildNumber: ${{ steps.compute_per_version.outputs.appleBuildNumber }}" >> $GITHUB_STEP_SUMMARY
          echo "Windows buildNumber: ${{ steps.compute_per_version.outputs.windowsBuildNumber }}" >> $GITHUB_STEP_SUMMARY

          echo "Deployment environment: ${{ steps.compute_environment.outputs.environmentName }}" >> $GITHUB_STEP_SUMMARY

      - name: Install .NET Workloads
        run: dotnet workload restore

      - name: Compile Solution (Debug Validation Step)
        run: |
          dotnet build ${{env.APPHOST_CSPROJ}} -c Debug
          dotnet build ${{env.WEB_CSPROJ}} -c Debug
          dotnet build ${{env.WEBAPI_CSPROJ}} -c Debug

      - name: Run solution test suites with coverage
        run: |
          mkdir -p TestResults
          dotnet test test/BookShelves.WebApi.Tests/BookShelves.WebApi.Tests.csproj --configuration Debug --collect:"XPlat Code Coverage" --logger "trx;LogFileName=BookShelves.WebApi.Tests.trx" --results-directory TestResults
          dotnet test test/BookShelves.Shared.Tests/BookShelves.Shared.Tests.csproj --configuration Debug --collect:"XPlat Code Coverage" --logger "trx;LogFileName=BookShelves.Shared.Tests.trx" --results-directory TestResults
          dotnet test test/BookShelves.Web.Shared.Tests/BookShelves.Web.Shared.Tests.csproj --configuration Debug --collect:"XPlat Code Coverage" --logger "trx;LogFileName=BookShelves.Web.Shared.Tests.trx" --results-directory TestResults
          dotnet test test/BookShelves.Maui.Data.Tests/BookShelves.Maui.Data.Tests.csproj --configuration Debug --collect:"XPlat Code Coverage" --logger "trx;LogFileName=BookShelves.Maui.Data.Tests.trx" --results-directory TestResults

      - name: Upload validation test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BookShelves-validation-test-results-${{ github.run_id }}
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload validation coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BookShelves-validation-coverage-${{ github.run_id }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Publish validation summary
        if: always()
        run: |
          echo "### Validation test artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- TRX files: $(find TestResults -name '*.trx' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage files: $(find TestResults -name 'coverage.cobertura.xml' | wc -l)" >> $GITHUB_STEP_SUMMARY


  # =================================================================
  # STAGE 2: CONTAINER DEPLOYMENTS (Linux Matrix Runner)
  # =================================================================
  publish-docker:
    name: Publish Containers to Private Registry
    needs: validate
    if: |
      startsWith(github.ref_name, 'release/') ||
      startsWith(github.ref_name, 'Release/') ||
      github.ref_name == 'main' ||
      (github.ref_type == 'tag' && needs.validate.outputs.IsValidReleaseTag == 'true')
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.EnvironmentName }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Log in to Private Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.NAS_DOCKER_REGISTRY_URL }}
          username: ${{ secrets.NAS_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.NAS_DOCKER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --- WEB APPLICATION PROJECT ---
      - name: Build and Push Web App Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}/src
          file: ${{env.WEB_PROJPATH}}/Dockerfile # Path to your Web App Dockerfile
          push: true
          # no-cache: true
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.MajorMinorPatch }}
            RUN_ID=${{ github.run_id }}
            GitVersion_AssemblySemFileVer=${{ needs.validate.outputs.AssemblySemFileVer }}
            GitVersion_AssemblySemVer=${{ needs.validate.outputs.AssemblySemVer }}
            GitVersion_CommitsSinceVersionSource=${{ needs.validate.outputs.CommitsSinceVersionSource }}
            GitVersion_FullSemVer=${{ needs.validate.outputs.FullSemVer }}
            GitVersion_InformationalVersion=${{ needs.validate.outputs.InformationalVersion }}
            GitVersion_MajorMinorPatch=${{ needs.validate.outputs.MajorMinorPatch }}
            GitVersion_SemVer=${{ needs.validate.outputs.SemVer }}
          tags: |
            ${{ secrets.NAS_DOCKER_REGISTRY_URL }}/bookshelves-web:${{ needs.validate.outputs.ArtifactVersion }}
            ${{ secrets.NAS_DOCKER_REGISTRY_URL }}/bookshelves-web:${{ needs.validate.outputs.EnvironmentName }}
            ${{ !contains(needs.validate.outputs.SemVer, '-') && format('{0}/bookshelves-web:latest', secrets.NAS_DOCKER_REGISTRY_URL) || '' }}
          # 2. Added GHA caching for Web App
          cache-from: type=gha,scope=docker-web
          cache-to: type=gha,mode=max,scope=docker-web

      # --- WEB API PROJECT ---
      - name: Build and Push Web API Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}/src
          file: ${{env.WEBAPI_PROJPATH}}/Dockerfile # Path to your Web App Dockerfile
          push: true
          # no-cache: true
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.MajorMinorPatch }}
            RUN_ID=${{ github.run_id }}
            GitVersion_AssemblySemFileVer=${{ needs.validate.outputs.AssemblySemFileVer }}
            GitVersion_AssemblySemVer=${{ needs.validate.outputs.AssemblySemVer }}
            GitVersion_CommitsSinceVersionSource=${{ needs.validate.outputs.CommitsSinceVersionSource }}
            GitVersion_FullSemVer=${{ needs.validate.outputs.FullSemVer }}
            GitVersion_InformationalVersion=${{ needs.validate.outputs.InformationalVersion }}
            GitVersion_MajorMinorPatch=${{ needs.validate.outputs.MajorMinorPatch }}
            GitVersion_SemVer=${{ needs.validate.outputs.SemVer }}
          tags: |
            ${{ secrets.NAS_DOCKER_REGISTRY_URL }}/bookshelves-webapi:${{ needs.validate.outputs.ArtifactVersion }}
            ${{ secrets.NAS_DOCKER_REGISTRY_URL }}/bookshelves-webapi:${{ needs.validate.outputs.EnvironmentName }}
            ${{ !contains(needs.validate.outputs.SemVer, '-') && format('{0}/bookshelves-webapi:latest', secrets.NAS_DOCKER_REGISTRY_URL) || '' }}
          # 2. Added GHA caching for Web API
          cache-from: type=gha,scope=docker-webapi
          cache-to: type=gha,mode=max,scope=docker-webapi

  # =================================================================
  # STAGE 3: APPLE PUBLISH (iOS .ipa & MacCatalyst .pkg on Mac)
  # =================================================================
  publish-apple:
    name: Build iOS & MacCatalyst
    needs: validate
    if: |
      startsWith(github.ref_name, 'release/') ||
      startsWith(github.ref_name, 'Release/') ||
      github.ref_name == 'main' ||
      (github.ref_type == 'tag' && needs.validate.outputs.IsValidReleaseTag == 'true')
    runs-on: macos-26
    environment: ${{ needs.validate.outputs.EnvironmentName }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{env.MAUI_PROJPATH}}
    steps:
      - uses: actions/checkout@v7
        with: 
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: xcode diags 1
        run: |
            echo Mac OS version: $(sw_vers -productVersion)
            echo Installed Xcode versions:
            ls /Applications | grep 'Xcode'
            echo Currently selected Xcode:
            xcrun xcode-select --print-path

      # Select your required version
      - name: Select Xcode ${{env.XCODE_VERSION}}
        run: sudo xcode-select -s /Applications/Xcode_${{env.XCODE_VERSION}}.app #/Contents/Developer

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Add Xcode developer tools to PATH
        run: export PATH="/Applications/Xcode_${{env.XCODE_VERSION}}.app/Contents/Developer/usr/bin:$PATH"
    
    
      - name: Cert Info Quad Combined 1
        env:
          CERTIFICATE_BASE64: ${{secrets.QUAD_COMBINED_DIST_INST_CERT_P12}}
        run: |
          echo $CERTIFICATE_BASE64 | base64 --decode > quad_combined_cert.p12

      - name: Cert Info Quad Combined 2
        run: |
          openssl pkcs12 -in quad_combined_cert.p12 -passin pass:${{secrets.IOS_DIST_CERTIFICATES_P12_PASSWORD}} -info -nokeys

      - name: Import Quad Combined Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{secrets.QUAD_COMBINED_DIST_INST_CERT_P12}}
          p12-password: ${{secrets.IOS_DIST_CERTIFICATES_P12_PASSWORD}}
          keychain-password: ${{github.run_id}}

      # - name: Cert Info IOS 1
      #   env:
      #     CERTIFICATE_BASE64: ${{secrets.IOS_DIST_CERTIFICATES_P12}}
      #   run: |
      #     echo $CERTIFICATE_BASE64 | base64 --decode > ios_cert.p12

      # - name: Cert Info IOS 2
      #   run: |
      #     openssl pkcs12 -in ios_cert.p12 -passin pass:${{secrets.IOS_DIST_CERTIFICATES_P12_PASSWORD}} -info -nokeys

      # - name: Import IOS Code-Signing Certificates
      #   uses: Apple-Actions/import-codesign-certs@v7
      #   with:
      #     p12-file-base64: ${{secrets.IOS_DIST_CERTIFICATES_P12}}
      #     p12-password: ${{secrets.IOS_DIST_CERTIFICATES_P12_PASSWORD}}
      #     keychain-password: ${{github.run_id}}

      # - name: Cert Info MAC 1
      #   env:
      #     CERTIFICATE_BASE64: ${{secrets.MAC_COMBINED_DIST_INST_CERT_P12}}
      #   run: |
      #     echo $CERTIFICATE_BASE64 | base64 --decode > mac_cert.p12

      # - name: Cert Info MAC 2
      #   run: |
      #     openssl pkcs12 -in mac_cert.p12 -passin pass:${{secrets.IOS_DIST_CERTIFICATES_P12_PASSWORD}} -info -nokeys

      # - name: Import MAC Code-Signing Certificates
      #   uses: Apple-Actions/import-codesign-certs@v7
      #   with:
      #     # since we already have an ios cert, reuse the same keychain and password
      #     create-keychain: false
      #     keychain-password: ${{github.run_id}}

      #     # use this one for Mac app store/test flight
      #     p12-file-base64: ${{secrets.MAC_COMBINED_DIST_INST_CERT_P12}}
          
      #     use this one for ad-hoc
      #     # p12-file-base64: ${{ secrets.APPLE_DEVELOPMENT_CERT_P12 }}
          
      #     p12-password: ${{secrets.IOS_DIST_CERTIFICATES_P12_PASSWORD}}

      - name: Download Apple Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{env.MAUI_IOS_MAC_BUNDLE_ID}}
          issuer-id: ${{secrets.APPLE_APPSTORE_ISSUER_ID}}
          api-key-id: ${{secrets.APPLE_APPSTORE_KEY_ID}}
          api-private-key: ${{secrets.APPLE_APPSTORE_PRIVATE_KEY}}

      - name: Verify Xcode Simulators
        shell: pwsh
        run: xcrun simctl list devices

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{env.MAUI_PROJPATH}}/global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.sln
            **/global.json
            **/Directory.Packages.props
            **/NuGet.config

      - name: Install Apple Workloads
        shell: bash
        run: dotnet workload install maui-ios maui-maccatalyst
        working-directory: ${{env.MAUI_PROJPATH}}

      - name: Verify Dotnet SDKs
        shell: pwsh
        run: dotnet --list-sdks

      - name: Verify Dotnet Version
        shell: pwsh
        run: dotnet --version

      - name: Verify Dotnet Runtimes
        shell: pwsh
        run: dotnet --list-runtimes

      - name: Verify Dotnet Workloads
        shell: pwsh
        run: dotnet workload list

      - name: Create IOS publish folder
        shell: pwsh
        run: |
          cd ${{ github.workspace }}
          mkdir -p ${{env.MAUI_IOS_PUBLISH_PATH}}

      - name: Create MAC publish folder
        shell: pwsh
        run: |
          cd ${{ github.workspace }}
          mkdir -p ${{env.MAUI_MAC_PUBLISH_PATH}}

      # Overrides passed directly to MSBuild properties mapping to Apple variables
      - name: Build Apple Package
        shell: pwsh
        working-directory: ${{env.MAUI_PROJPATH}}
        run: |
          dotnet `
            publish `
            BookShelves.Maui.csproj `
            -c ${{env.RELEASE_CONFIGURATION}} `
            -f ${{env.DOTNET_VERSION}}-ios `
            -o ${{env.MAUI_IOS_PUBLISH_PATH}} `
            -v normal `
            -p:RuntimeIdentifier=ios-arm64 `
            -p:ArchiveOnBuild=true `
            -p:ArchiveBasePath="${{ github.workspace }}/publish-output/ios-archive" `
            -p:CodesignKey="${{env.MAUI_IOS_CODESIGN_KEY}}" `
            -p:CodesignProvision="${{env.MAUI_IOS_CODESIGN_PROVISION}}" `
            -p:CodesignEntitlements="${{env.MAUI_IOS_CODESIGN_ENTITLEMENTS}}" `
            -p:MtouchUseLlvm=false `
            -p:MtouchLink=SdkOnly `
            -p:DebugSymbols=true `
            -p:NoDSymUtil=false `
            -p:ApplicationDisplayVersion="${{needs.validate.outputs.DisplayVersion}}" `
            -p:ApplicationVersion=${{needs.validate.outputs.AppleBuildNumber}} `
            -p:InformationalVersion="${{needs.validate.outputs.InformationalVersion}}"

          dotnet `
            publish `
            BookShelves.Maui.csproj `
            -c ${{env.RELEASE_CONFIGURATION}} `
            -f ${{env.DOTNET_VERSION}}-maccatalyst `
            -o ${{env.MAUI_MAC_PUBLISH_PATH}} `
            -v normal `
            -p:RuntimeIdentifier=maccatalyst-arm64 `
            -p:MtouchLink=SdkOnly `
            -p:CreatePackage=true `
            -p:EnableCodeSigning=true `
            -p:CodesignKey="${{env.MAUI_MAC_CODESIGN_KEY}}" `
            -p:CodesignProvision="${{env.MAUI_MAC_CODESIGN_PROVISION}}" `
            -p:EnablePackageSigning=true `
            -p:PackageSigningKey="${{env.MAUI_MAC_PACKAGE_SIGNING_KEY}}" `
            -p:CodesignEntitlements="${{env.MAUI_MAC_CODESIGN_ENTITLEMENTS}}" `
            -p:UseHardenedRuntime=true `
            -p:MtouchUseLlvm=false `
            -p:ApplicationDisplayVersion="${{needs.validate.outputs.DisplayVersion}}" `
            -p:ApplicationVersion=${{needs.validate.outputs.AppleBuildNumber}} `
            -p:InformationalVersion="${{needs.validate.outputs.InformationalVersion}}"

      - name: Show workspace folder content
        shell: pwsh
        run: |
          cd '${{github.workspace}}'
          Get-Childitem -Path ${{github.workspace}} -Include *.* -File -Recurse

      - name: Show IOS publish folder content
        shell: pwsh
        run: |
          Get-Childitem -Path ${{env.MAUI_IOS_PUBLISH_PATH}} -Include *.* -File -Recurse

      - name: Show MAC publish folder content
        shell: pwsh
        run: |
          Get-Childitem -Path ${{env.MAUI_MAC_PUBLISH_PATH}} -Include *.* -File -Recurse

      - name: Locate IOS IPA
        # if: ${{ github.event_name == 'workflow_dispatch' }}
        id: findipa
        run: |
          IPA_PATH=$(find ${{env.MAUI_IOS_PUBLISH_PATH}} -maxdepth 1 -name '*.ipa' | head -n1)
          # IPA_PATH=$(find MyScoreBoardMaui/bin/${{env.RELEASE_CONFIGURATION}}/${{env.DOTNET_VERSION}}-ios/${{env.RUNTIME_ID}}/publish -maxdepth 1 -name '*.ipa' | head -n1)
          if [ -z "$IPA_PATH" ]; then
            echo 'IPA not found' >&2
            exit 1
          fi
          echo "ipa=$IPA_PATH" >> $GITHUB_OUTPUT

      - name: Locate MAC PKG
        # if: ${{ github.event_name == 'workflow_dispatch' }}
        id: findpkg
        run: |
          PKG_PATH=$(find ${{env.MAUI_MAC_PUBLISH_PATH}} -maxdepth 1 -name '*.pkg' | head -n1)
          if [ -z "$PKG_PATH" ]; then
            echo 'PKG not found' >&2
            exit 1
          fi
          echo "pkg=$PKG_PATH" >> $GITHUB_OUTPUT

      - name: Collect IOS symbols
        shell: pwsh
        run: |
          $symbolsPath = "${{ github.workspace }}/publish-output/ios-symbols"
          New-Item -ItemType Directory -Force -Path $symbolsPath | Out-Null

          $searchRoots = @(
            "${{ env.MAUI_IOS_PUBLISH_PATH }}",
            "${{ github.workspace }}/${{ env.MAUI_PROJPATH }}/bin/${{ env.RELEASE_CONFIGURATION }}/${{ env.DOTNET_VERSION }}-ios",
            "${{ github.workspace }}/publish-output/ios-archive"
          )

          foreach ($root in $searchRoots)
          {
            if (Test-Path $root)
            {
              Get-ChildItem -Path $root -Recurse -Directory -Filter *.dSYM -ErrorAction SilentlyContinue |
                ForEach-Object {
                  $dest = Join-Path $symbolsPath $_.Name
                  Copy-Item -Path $_.FullName -Destination $dest -Recurse -Force
                }

              Get-ChildItem -Path $root -Recurse -File -Filter *.pdb -ErrorAction SilentlyContinue |
                Copy-Item -Destination $symbolsPath -Force
            }
          }

          Write-Host "Collected symbol files:"
          Get-ChildItem -Path $symbolsPath -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

          $dsyms = Get-ChildItem -Path $symbolsPath -Recurse -Directory -Filter *.dSYM -ErrorAction SilentlyContinue
          if (-not $dsyms)
          {
            Write-Error "No iOS dSYM symbols were found. Checked: $($searchRoots -join ', ')"
          }

      - name: Validate IOS app and dSYM UUID match
        shell: bash
        run: |
          set -euo pipefail

          IPA_PATH='${{steps.findipa.outputs.ipa}}'
          SYMBOLS_ROOT='${{ github.workspace }}/publish-output/ios-symbols'

          TMP_DIR=$(mktemp -d)
          unzip -qq "$IPA_PATH" -d "$TMP_DIR"

          APP_DIR=$(find "$TMP_DIR/Payload" -maxdepth 1 -type d -name '*.app' | head -n1)
          if [ -z "$APP_DIR" ]; then
            echo 'Unable to locate .app inside IPA payload.' >&2
            exit 1
          fi

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_DIR/Info.plist")
          APP_BINARY="$APP_DIR/$EXECUTABLE"

          if [ ! -f "$APP_BINARY" ]; then
            echo "Unable to locate app executable at $APP_BINARY" >&2
            exit 1
          fi

          APP_UUID=$(dwarfdump --uuid "$APP_BINARY" | awk '{print toupper($2)}' | head -n1)
          if [ -z "$APP_UUID" ]; then
            echo 'Unable to read app UUID from IPA executable.' >&2
            exit 1
          fi

          MATCHED_DSYM=''
          while IFS= read -r DSYM_DIR; do
            DSYM_BIN=$(find "$DSYM_DIR/Contents/Resources/DWARF" -type f | head -n1 || true)
            if [ -z "$DSYM_BIN" ]; then
              continue
            fi

            if dwarfdump --uuid "$DSYM_BIN" | awk '{print toupper($2)}' | grep -q "$APP_UUID"; then
              MATCHED_DSYM="$DSYM_DIR"
              break
            fi
          done < <(find "$SYMBOLS_ROOT" -type d -name '*.dSYM')

          echo "App UUID: $APP_UUID"
          if [ -n "$MATCHED_DSYM" ]; then
            echo "Matched dSYM: $MATCHED_DSYM"
          else
            echo 'No dSYM with matching UUID was found for the IPA executable.' >&2
            exit 1
          fi

      - name: Archive IOS symbols artifact
        uses: actions/upload-artifact@v7
        with:
          name: BookShelves-ios-symbols-${{ needs.validate.outputs.ArtifactVersion }}
          path: '${{ github.workspace }}/publish-output/ios-symbols'
          compression-level: 0

      - name: Archive IOS build artifact
        uses: actions/upload-artifact@v7
        with:
          name: BookShelves-ios-ipa-${{ needs.validate.outputs.ArtifactVersion }}
          path: ${{steps.findipa.outputs.ipa}} #${{ env.IOS_ARTIFACTS_PATH }} #'${{ github.workspace }}/src/BookShelves.WinUI/bin/Release/net8.0-windows10.0.19041.0/win10-x64/AppPackages/*'
          compression-level: 0

      - name: Archive MAC build artifact
        uses: actions/upload-artifact@v7
        with:
          name: BookShelves-mac-pkg-${{ needs.validate.outputs.ArtifactVersion }}
          path: ${{steps.findpkg.outputs.pkg}}
          compression-level: 0

      - name: 'Upload IOS app to TestFlight'
        # if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-type: 'ios'
          app-path: ${{ steps.findipa.outputs.ipa }}
          issuer-id: ${{secrets.APPLE_APPSTORE_ISSUER_ID}}
          api-key-id: ${{secrets.APPLE_APPSTORE_KEY_ID}}
          api-private-key: ${{secrets.APPLE_APPSTORE_PRIVATE_KEY}}
          wait-for-processing: 'false'

      - name: Authenticate App Store Connect API Key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_APPSTORE_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APPLE_APPSTORE_KEY_ID }}.p8

      - name: Upload MAC pkg to TestFlight via altool
        run: |
          xcrun altool --upload-app \
            --type macos \
            --file ${{steps.findpkg.outputs.pkg}} \
            --apiKey "${{ secrets.APPLE_APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPLE_APPSTORE_ISSUER_ID }}"

  # =================================================================
  # STAGE 4: WINDOWS PUBLISH (MAUI .msix on Windows)
  # =================================================================
  publish-windows:
    name: Build Windows App
    needs: validate
    if: |
      startsWith(github.ref_name, 'release/') ||
      startsWith(github.ref_name, 'Release/') ||
      github.ref_name == 'main' ||
      (github.ref_type == 'tag' && needs.validate.outputs.IsValidReleaseTag == 'true')
    runs-on: windows-latest
    environment: ${{ needs.validate.outputs.EnvironmentName }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{env.MAUI_PROJPATH}}
    steps:
      - uses: actions/checkout@v7
        with: 
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{env.DOTNET_SDK_VERSION}}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.sln
            **/global.json
            **/Directory.Packages.props
            **/NuGet.config

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Install Windows Workloads
        shell: pwsh
        run: dotnet workload install maui-windows
        working-directory: ${{env.MAUI_PROJPATH}}

      - name: Decrypt PFX File
        run: |
          echo "${{ secrets.WINDOWS_PFX_FILE }}" > cert.pfx.asc
          certutil -decode cert.pfx.asc cert.pfx

      - name: Add Cert to Store
        run: certutil -user -q -p ${{ secrets.WINDOWS_PFX_PASSWORD }} -importpfx cert.pfx NoRoot

      - name: Create publish folder
        shell: pwsh
        run: |
          cd ${{ github.workspace }}
          mkdir -p ${{ env.MAUI_WINDOWS_PUBLISH_PATH }}

      - name: Build Windows Packages
        working-directory: ${{env.MAUI_PROJPATH}}
        run: |
          dotnet publish BookShelves.Maui.csproj `
            -v minimal `
            -f ${{env.DOTNET_VERSION}}-windows10.0.19041.0 `
            -c ${{env.RELEASE_CONFIGURATION}} `
            -o ${{ env.MAUI_WINDOWS_PUBLISH_PATH }} `
            --self-contained false `
            -v normal `
            -p:RuntimeIdentifierOverride=win10-x64 `
            -p:InvariantGlobalization=true `
            -p:GenerateTestArtifacts=false `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint="${{ secrets.WINDOWS_PFX_THUMBPRINT }}" `
            -p:ApplicationDisplayVersion="${{ needs.validate.outputs.DisplayVersion }}" `
            -p:ApplicationVersion=${{ needs.validate.outputs.WindowsBuildNumber}} `
            -p:Version=${{ needs.validate.outputs.FullSemVer }} `
            -p:PackageVersion=${{ needs.validate.outputs.MajorMinorPatch }} `
            -p:InformationalVersion="${{ needs.validate.outputs.InformationalVersion }}"
          # -v options are quiet, minimal, normal, detailed, diagnostic

      - name: Show project folder content
        shell: pwsh
        run: |
          Get-Childitem -Path . -Include *.* -File -Recurse

      - name: Show publish folder content
        shell: pwsh
        run: |
          Get-Childitem -Path ${{ env.MAUI_WINDOWS_PUBLISH_PATH }} -Include *.* -File -Recurse

      - name: Stage Windows installer artifacts
        shell: pwsh
        run: |
          $stagePath = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows"
          if (Test-Path $stagePath) {
            Remove-Item -Path $stagePath -Recurse -Force
          }
          New-Item -Path $stagePath -ItemType Directory | Out-Null

          $appPackagesPath = Join-Path $env:GITHUB_WORKSPACE "publish-output\windows"
          $legacyAppPackagesPath = Join-Path $env:GITHUB_WORKSPACE "src\BookShelves.Maui\AppPackages"
          if (Test-Path $legacyAppPackagesPath) {
            $appPackagesPath = $legacyAppPackagesPath
          }
          elseif (Test-Path (Join-Path $appPackagesPath 'AppPackages')) {
            $appPackagesPath = Join-Path $appPackagesPath 'AppPackages'
          }

          $packages = Get-ChildItem -Path $appPackagesPath -Recurse -File -Include *.msix,*.msixbundle | Where-Object { $_.FullName -notmatch '\\Dependencies\\' }
          if (-not $packages) {
            throw "No MSIX/MSIXBundle files were found under $appPackagesPath"
          }

          foreach ($package in $packages) {
            Copy-Item -Path $package.FullName -Destination (Join-Path $stagePath $package.Name) -Force
          }

          $dependencyRoots = Get-ChildItem -Path $appPackagesPath -Recurse -Directory | Where-Object { $_.Name -eq 'Dependencies' }
          if ($dependencyRoots) {
            foreach ($dependencyRoot in $dependencyRoots) {
              $dependencyFiles = Get-ChildItem -Path $dependencyRoot.FullName -Recurse -File
              foreach ($dependencyFile in $dependencyFiles) {
                $relativeDependencyPath = $dependencyFile.FullName.Substring($dependencyRoot.FullName.Length).TrimStart('\\')
                $destinationPath = Join-Path $stagePath (Join-Path 'Dependencies' $relativeDependencyPath)
                $destinationDirectory = Split-Path -Path $destinationPath -Parent
                if (-not (Test-Path $destinationDirectory)) {
                  New-Item -Path $destinationDirectory -ItemType Directory -Force | Out-Null
                }
                Copy-Item -Path $dependencyFile.FullName -Destination $destinationPath -Force
              }
            }
          }

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: BookShelves-windows-msix-${{ needs.validate.outputs.ArtifactVersion }}
          path: ${{ github.workspace }}\artifacts\windows\*

