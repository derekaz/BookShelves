name: BookShelves Flaky Test Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

concurrency:
  group: bookshelves-flaky-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SDK_VERSION: '10.0.x'

jobs:
  flaky-monitor:
    name: Repeated test reliability run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: BookShelves.WebApi.Tests
            project: test/BookShelves.WebApi.Tests/BookShelves.WebApi.Tests.csproj
          - name: BookShelves.Shared.Tests
            project: test/BookShelves.Shared.Tests/BookShelves.Shared.Tests.csproj
          - name: BookShelves.Web.Shared.Tests
            project: test/BookShelves.Web.Shared.Tests/BookShelves.Web.Shared.Tests.csproj
          - name: BookShelves.Maui.Data.Tests
            project: test/BookShelves.Maui.Data.Tests/BookShelves.Maui.Data.Tests.csproj
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.sln
            **/*.slnx
            **/global.json
            **/Directory.Packages.props
            **/NuGet.config

      - name: Restore workloads
        run: dotnet workload restore

      - name: Repeat tests three times
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ matrix.project }}"
          PROJECT_NAME=$(basename "$PROJECT" .csproj)
          RESULTS_DIR="FlakyResults/${PROJECT_NAME}"
          mkdir -p "$RESULTS_DIR"

          FAILURES=0

          for i in 1 2 3; do
            echo "Running ${PROJECT_NAME} pass ${i}/3"

            if ! dotnet test "$PROJECT" --configuration Debug --no-restore --logger "trx;LogFileName=${PROJECT_NAME}.run${i}.trx" --results-directory "$RESULTS_DIR"; then
              FAILURES=$((FAILURES+1))
            fi
          done

          if [ "$FAILURES" -gt 0 ]; then
            echo "Detected ${FAILURES} failed pass(es) in repeated execution for ${PROJECT_NAME}." >&2
            exit 1
          fi

      - name: Upload flaky-monitor results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BookShelves-flaky-monitor-${{ matrix.name }}-${{ github.run_id }}
          path: FlakyResults/**/*.trx
          if-no-files-found: warn

      - name: Publish flaky-monitor summary
        if: always()
        shell: bash
        run: |
          echo "### Flaky monitor: ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- TRX files: $(find FlakyResults -name '*.trx' | wc -l)" >> $GITHUB_STEP_SUMMARY
